MaintainerName: abdiCobos
Categories:
  - Games
License: GPL-3.0-or-later
SourceCode: https://github.com/abdiCobos/pokerDiceDash
IssueTracker: https://github.com/abdiCobos/pokerDiceDash/issues
Name: Poker Dice Dash
Summary: Un juego de póker y más para móviles
Description: |-
  Juega Poker en tu red local sin depender de servidores de terceros.
  
  Soporta múltiples jugadores a través de NSD y Sockets LAN.
  
  Incluye mecánicas modernas y estadísticas limitadas para asegurar una experiencia limpia y gratuita.

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: master
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.24.3
    rm:
      - ios/
      - macos/
      - windows/
      - linux/
      - web/
    build:
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter build apk --release --dart-define=SENTRY_DSN='https://0bf3a6dc1cee47f993fcd572d2db4c3d@app.glitchtip.com/27827'

AutoUpdateMode: Version
UpdateCheckMode: Tags
